# `app.toml` — every key is namespaced under `app.*` at load time.
# Use { from = "ENV_VAR", default = <literal> } to bind a value to the
# process environment; the literal's type is preserved.

[app]
name = { from = "APP_NAME", default = "{{name}}" }
env  = { from = "APP_ENV",  default = "local" }

[server]
host = { from = "APP_SERVER_HOST", default = "127.0.0.1" }
port = { from = "APP_SERVER_PORT", default = 3000 }
