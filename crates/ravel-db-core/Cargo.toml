[package]
name = "ravel-db-core"
version = "0.1.0"
edition = "2024"
description = "Database abstraction traits for Ravel: connection management, migration runner, pagination, schema builder"
license = "MIT"
repository = "https://github.com/jwwb681232/ravel"
homepage = "https://github.com/jwwb681232/ravel"
documentation = "https://docs.rs/ravel-db-core"
keywords = ["ravel", "database", "orm", "migration", "schema"]
categories = ["database", "web-programming"]
readme = "../../README.md"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
