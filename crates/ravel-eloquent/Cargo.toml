[package]
name = "ravel-eloquent"
version = "0.1.0"
edition = "2024"
description = "Eloquent-style ORM for Ravel — #[derive(Model)] with fluent query builder"
license = "MIT"
repository = "https://github.com/jwwb681232/ravel"
categories = ["database"]
keywords = ["ravel", "eloquent", "orm", "sea-orm"]

[dependencies]
ravel-eloquent-macros = { path = "../ravel-eloquent-macros" }
ravel-core = { path = "../ravel-core" }
ravel-db-seaorm = { path = "../ravel-db-seaorm" }
ravel-error = { path = "../ravel-error" }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ravel-test = { path = "../ravel-test" }
chrono = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["full"] }
