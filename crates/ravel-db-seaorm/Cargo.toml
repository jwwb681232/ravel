[package]
name = "ravel-db-seaorm"
version = "0.1.0"
edition = "2024"
description = "SeaORM database backend for Ravel: connection manager, migration runner, model helpers"
license = "MIT"
repository = "https://github.com/jwwb681232/ravel"
homepage = "https://github.com/jwwb681232/ravel"
documentation = "https://docs.rs/ravel-db-seaorm"
keywords = ["ravel", "sea-orm", "database", "orm", "migration"]
categories = ["database", "web-programming"]
readme = "../../README.md"

[dependencies]
ravel-core = { path = "../ravel-core" }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
