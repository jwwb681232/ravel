[package]
name = "ravel-facades"
version = "0.1.0"
edition = "2024"
description = "Laravel-style static facades for the Ravel framework"
license = "MIT"
repository = "https://github.com/jwwb681232/ravel"
categories = ["web-programming"]
keywords = ["ravel", "facade", "web", "framework"]

[dependencies]
# Core — always available
ravel-core = { path = "../ravel-core" }
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP — optional
ravel-http = { path = "../ravel-http", optional = true }
axum = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }

# Support — optional
ravel-support = { path = "../ravel-support", optional = true }
tokio = { workspace = true, features = ["full"], optional = true }
tracing = { workspace = true, optional = true }

[features]
default = ["http", "support"]
http = ["ravel-http", "axum", "parking_lot"]
support = ["ravel-support", "tokio", "tracing"]
full = ["http", "support"]
