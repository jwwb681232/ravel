[package]
name = "ravel-http"
version = "0.1.0"
edition = "2024"

[dependencies]
ravel-core = { path = "../ravel-core" }
axum = "0.8"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tera = "1"
regex = "1"
tower = "0.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
