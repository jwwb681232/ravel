[package]
name = "ravel-http"
version = "0.1.0"
edition = "2024"
description = "HTTP layer for Ravel: route builder, server, middleware, session, auth, CSRF, rate limiting, file upload, validation"
license = "MIT"
repository = "https://github.com/jwwb681232/ravel"
homepage = "https://github.com/jwwb681232/ravel"
documentation = "https://docs.rs/ravel-http"
keywords = ["ravel", "http", "router", "middleware", "session", "auth"]
categories = ["web-programming::http-server", "web-programming"]
readme = "../../README.md"

[dependencies]
ravel-core = { path = "../ravel-core" }
axum = { version = "0.8", features = ["multipart"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tera = "1"
regex = "1"
tower = "0.5"
tracing = "0.1"
rand = "0.8"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
