[package]
name = "ravel-eloquent-macros"
version = "0.1.0"
edition = "2024"
description = "Proc-macro for #[derive(Model)] — Eloquent-style ORM for Ravel"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
sea-orm = "2.0.0-rc.40"
