[package]
name = "ravel-support"
version = "0.1.0"
edition = "2024"

[dependencies]
ravel-core = { path = "../ravel-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tracing = "0.1"
redis = { version = "0.25", features = ["tokio-comp", "aio"], optional = true }
sea-orm = { version = "1", optional = true }

[features]
default = []
redis-driver = ["redis"]
db-driver = ["sea-orm"]