[package]
name = "ravel-support"
version = "0.1.0"
edition = "2024"
description = "Support services for Ravel: async job queue, task scheduler, file storage"
license = "MIT"
repository = "https://github.com/jwwb681232/ravel"
homepage = "https://github.com/jwwb681232/ravel"
documentation = "https://docs.rs/ravel-support"
keywords = ["ravel", "queue", "scheduler", "storage", "job"]
categories = ["web-programming", "concurrency"]
readme = "../../README.md"

[dependencies]
ravel-core = { path = "../ravel-core" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
redis = { workspace = true, optional = true }
