[package]
name = "ravel-support"
version = "0.1.0"
edition = "2024"
description = "Support services for Ravel: async job queue, task scheduler, file storage"
license = "MIT"
repository = "https://github.com/jwwb681232/ravel"
homepage = "https://github.com/jwwb681232/ravel"
documentation = "https://docs.rs/ravel-support"
keywords = ["ravel", "queue", "scheduler", "storage", "job"]
categories = ["web-programming", "concurrency"]
readme = "../../README.md"

[dependencies]
ravel-core = { path = "../ravel-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tracing = "0.1"
