[package]
name = "ravel-core"
version = "0.1.0"
edition = "2024"
description = "Core framework for Ravel: DI container, config, env, events, cache, encryption, password hashing, structured logging"
license = "MIT"
repository = "https://github.com/jwwb681232/ravel"
homepage = "https://github.com/jwwb681232/ravel"
documentation = "https://docs.rs/ravel-core"
keywords = ["ravel", "di", "container", "config", "encryption"]
categories = ["web-programming", "development-tools"]
readme = "../../README.md"

[dependencies]
anyhow = { workspace = true }
dotenvy = "0.15"
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bcrypt = { workspace = true }
aes-gcm = "0.10"
base64 = { workspace = true }
rand = { workspace = true }
