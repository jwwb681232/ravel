avel-cli/src/commands/model.rs", "write_file=crates/ravel-cli/src/commands/serve.rs", "write_file=crates/ravel-cli/src/commands/route_list.rs", "bash=Remove-Item crates/ravel-cli/src/commands/make_model.rs -ErrorAction SilentlyContinue", "bash=cargo build -p ravel-cli 2>&1", "multi_edit=crates/ravel-cli/src/main.rs", "edit_file=crates/ravel-cli/src/commands/model.rs", "edit_file=crates/ravel-cli/src/commands/new.rs", "edit_file=crates/ravel-cli/src/commands/serve.rs", "edit_file=crates/ravel-cli/src/main.rs", "delete_range=crates/ravel-cli/src/main.rs", "bash=cargo build --workspace 2>&1", "bash=cargo test --workspace 2>&1", "bash=$tmp = Join-Path $env:TEMP \"ravel_cli_test\"; Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue; cargo run --bin ravel-cli -- new $tmp 2>&1", "bash=$tmp = Join-Path $env:TEMP \"ravel_cli_test\"; Get-ChildItem $tmp -Recurse -Directory -Name", "bash=$tmp = Join-Path $env:TEMP \"ravel_cli_test\"; cargo run --bin ravel-cli -- make controller UserController 2>&1", "bash=$tmp = Join-Path $env:TEMP \"ravel_cli_test\"; Set-Location $tmp; $env:RAVEL_BIN = Join-Path (Get-Location) \"..\\..\\target\\debug\\ravel-cli.exe\"; & \"$env:RAVEL_BIN\" make middleware AuthMiddleware 2>&1", "bash=$tmp = Join-Path $env:TEMP \"ravel_cli_test\"; Set-Location $tmp; cargo run --manifest-path E:\\rust\\ravel\\Cargo.toml --bin ravel-cli -- make middleware AuthMiddleware 2>&1", "bash=$tmp = Join-Path $env:TEMP \"ravel_cli_test\"; Get-ChildItem $tmp/app/Http/Middleware/AuthMiddleware.rs | Select-Object Name", "bash=$tmp = Join-Path $env:TEMP \"ravel_cli_test\"; Set-Location $tmp; cargo run --manifest-path E:\\rust\\ravel\\Cargo.toml --bin ravel-cli -- make migration CreateUsersTable", "bash=$tmp = Join-Path $env:TEMP \"ravel_cli_test\"; Get-ChildItem $tmp/database/migrations/", "bash=Remove-Item (Join-Path $env:TEMP \"ravel_cli_test\") -Recurse -Force -ErrorAction SilentlyContinue", "bash=cargo test --workspace"]
# ask = ["write_file"]   # force a prompt even if otherwise allowed

[sandbox]
# Confine tool blast radius. File-writers (write_file/edit_file/multi_edit)
# may only write under workspace_root (empty = current dir) + allow_write.
# bash = "enforce" (default) jails each command in an OS sandbox (macOS now;
# graceful fallback elsewhere); "off" disables it. network allows egress.
# workspace_root = ""            # default: current working directory
# allow_write = ["/tmp"]          # extra dirs writers may also modify
bash    = "enforce"
network = true

[statusline]
# A custom status line: a command whose first stdout line replaces the built-in
# data row. It receives {"model","contextUsed","contextWindow","cwd"} as JSON on stdin.
# command = "my-statusline.sh"

